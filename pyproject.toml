[project]
name = "carf-intelligence"
version = "0.1.0"
description = "Coleta, anonimização e consulta de acórdãos do CARF"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandas>=2.1",
]

[project.optional-dependencies]
# spaCy 3.8 + hashing libs mais novas quebram o carregamento do modelo (OverflowError
# no tokenizer); estas versões foram verificadas.
ner = [
    "spacy==3.8.7",
    "murmurhash==1.0.12",
    "preshed==3.0.9",
    "cymem==2.0.11",
    "pt_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl",
]
ask = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
carf = "carf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
